<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Outer Badge -->
  <rect x="2" y="2" width="28" height="28" fill="#4A2E18" rx="4"/>
  <rect x="3" y="3" width="26" height="26" fill="#D4AF37" rx="3"/>
  <rect x="4" y="4" width="24" height="24" fill="#FDF6E2" rx="2"/>
  <rect x="5" y="5" width="22" height="22" fill="#2D4A3E" rx="1"/>

  <!-- Envelope Body -->
  <rect x="7" y="10" width="18" height="13" fill="#4A2E18"/>
  <rect x="8" y="11" width="16" height="11" fill="#FDF6E2"/>

  <!-- Envelope Flap -->
  <polygon points="8,11 16,17 24,11" fill="#EAD9BE"/>
  <polygon points="8,11 16,17 24,11" fill="none" stroke="#4A2E18" stroke-width="1"/>

  <!-- Wax Seal in Center -->
  <circle cx="16" cy="17" r="3" fill="#961C1C"/>
  <circle cx="16" cy="17" r="2" fill="#C92A2A"/>
  <!-- Heart impression on seal -->
  <rect x="15" y="16" width="2" height="2" fill="#FDF6E2"/>
</svg>
