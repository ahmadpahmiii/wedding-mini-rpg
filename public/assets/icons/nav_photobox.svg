<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Outer Badge -->
  <rect x="2" y="2" width="28" height="28" fill="#4A2E18" rx="4"/>
  <rect x="3" y="3" width="26" height="26" fill="#D4AF37" rx="3"/>
  <rect x="4" y="4" width="24" height="24" fill="#FDF6E2" rx="2"/>
  <rect x="5" y="5" width="22" height="22" fill="#2D4A3E" rx="1"/>

  <!-- Vintage Polaroid Camera Body -->
  <rect x="8" y="10" width="16" height="13" fill="#4A2E18"/>
  <rect x="9" y="11" width="14" height="11" fill="#FDF6E2"/>

  <!-- Flash Unit -->
  <rect x="10" y="12" width="3" height="3" fill="#58A6FF"/>
  <rect x="11" y="13" width="1" height="1" fill="#FFFFFF"/>

  <!-- Viewfinder -->
  <rect x="19" y="12" width="2" height="2" fill="#1A120B"/>

  <!-- Center Camera Lens -->
  <circle cx="16" cy="17" r="4" fill="#1A120B"/>
  <circle cx="16" cy="17" r="3" fill="#4A2E18"/>
  <circle cx="16" cy="17" r="2" fill="#58A6FF"/>
  <circle cx="15.5" cy="16.5" r="0.7" fill="#FFFFFF"/>

  <!-- Rainbow Stripe Accent -->
  <rect x="9" y="20" width="14" height="1" fill="#E89CAE"/>
  <rect x="9" y="21" width="14" height="1" fill="#F4E07B"/>
</svg>
