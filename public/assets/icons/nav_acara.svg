<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Outer Badge -->
  <rect x="2" y="2" width="28" height="28" fill="#4A2E18" rx="4"/>
  <rect x="3" y="3" width="26" height="26" fill="#D4AF37" rx="3"/>
  <rect x="4" y="4" width="24" height="24" fill="#FDF6E2" rx="2"/>
  <rect x="5" y="5" width="22" height="22" fill="#2D4A3E" rx="1"/>

  <!-- Calendar Page -->
  <rect x="8" y="9" width="16" height="15" fill="#FFFFFF"/>
  <!-- Top Red Header -->
  <rect x="8" y="9" width="16" height="4" fill="#961C1C"/>
  <!-- Calendar Binder Rings -->
  <rect x="10" y="7" width="2" height="3" fill="#4A2E18"/>
  <rect x="20" y="7" width="2" height="3" fill="#4A2E18"/>

  <!-- Heart Pin in Center -->
  <rect x="14" y="15" width="4" height="2" fill="#E89CAE"/>
  <rect x="13" y="16" width="6" height="2" fill="#961C1C"/>
  <rect x="14" y="18" width="4" height="2" fill="#961C1C"/>
  <rect x="15" y="20" width="2" height="1" fill="#961C1C"/>

  <!-- Page Fold Corner -->
  <polygon points="21,24 24,21 24,24" fill="#C4A482"/>
</svg>
