<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Outer Badge -->
  <rect x="2" y="2" width="28" height="28" fill="#4A2E18" rx="4"/>
  <rect x="3" y="3" width="26" height="26" fill="#D4AF37" rx="3"/>
  <rect x="4" y="4" width="24" height="24" fill="#FDF6E2" rx="2"/>
  <rect x="5" y="5" width="22" height="22" fill="#2D4A3E" rx="1"/>

  <!-- Speech Bubble Outline -->
  <rect x="8" y="8" width="16" height="1" fill="#4A2E18"/>
  <rect x="7" y="9" width="18" height="11" fill="#4A2E18"/>
  <rect x="8" y="20" width="16" height="1" fill="#4A2E18"/>
  <rect x="9" y="21" width="4" height="2" fill="#4A2E18"/>
  <rect x="9" y="23" width="2" height="1" fill="#4A2E18"/>

  <!-- Speech Bubble Body -->
  <rect x="8" y="9" width="16" height="11" fill="#FDF6E2"/>
  <rect x="10" y="20" width="2" height="2" fill="#FDF6E2"/>
  <rect x="8" y="18" width="16" height="2" fill="#EAD9BE"/>

  <!-- Typing Dots, the middle one a heart -->
  <rect x="10" y="13" width="2" height="2" fill="#4A2E18"/>
  <rect x="20" y="13" width="2" height="2" fill="#4A2E18"/>
  <rect x="14" y="12" width="2" height="2" fill="#C92A2A"/>
  <rect x="16" y="12" width="2" height="2" fill="#C92A2A"/>
  <rect x="14" y="14" width="4" height="1" fill="#961C1C"/>
  <rect x="15" y="15" width="2" height="1" fill="#961C1C"/>
  <!-- Sparkle -->
  <rect x="24" y="7" width="1" height="2" fill="#FFFFFF"/>
</svg>
