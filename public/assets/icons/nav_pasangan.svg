<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Outer Badge -->
  <rect x="2" y="2" width="28" height="28" fill="#4A2E18" rx="4"/>
  <rect x="3" y="3" width="26" height="26" fill="#D4AF37" rx="3"/>
  <rect x="4" y="4" width="24" height="24" fill="#FDF6E2" rx="2"/>
  <rect x="5" y="5" width="22" height="22" fill="#2D4A3E" rx="1"/>

  <!-- Couple Silhouette & Wedding Rings -->
  <!-- Groom (Left) -->
  <rect x="8" y="9" width="4" height="4" fill="#E5B895"/>
  <rect x="7" y="13" width="6" height="7" fill="#1A120B"/>
  <rect x="9" y="14" width="2" height="2" fill="#FFFFFF"/>

  <!-- Bride (Right) with Veil -->
  <rect x="18" y="9" width="4" height="4" fill="#E5B895"/>
  <rect x="17" y="7" width="6" height="2" fill="#FFFFFF"/>
  <rect x="16" y="9" width="8" height="11" fill="#FFFFFF"/>
  <rect x="18" y="13" width="4" height="7" fill="#FDF6E2"/>

  <!-- Interlocking Gold Rings -->
  <rect x="11" y="21" width="6" height="6" fill="#D4AF37"/>
  <rect x="12" y="22" width="4" height="4" fill="#2D4A3E"/>
  <rect x="15" y="21" width="6" height="6" fill="#D4AF37"/>
  <rect x="16" y="22" width="4" height="4" fill="#2D4A3E"/>
  <!-- Diamond Sparkle -->
  <rect x="13" y="20" width="2" height="2" fill="#58A6FF"/>
</svg>
