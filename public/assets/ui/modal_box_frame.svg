<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <!-- Outer Wood Border with Drop Shadow -->
  <rect x="8" y="8" width="484" height="384" fill="#2D1E18" stroke="#4A2E18" stroke-width="4" rx="16"/>
  <rect x="14" y="14" width="472" height="372" fill="#734D2E" rx="12"/>
  <rect x="20" y="20" width="460" height="360" fill="#FDF6E2" rx="8"/>

  <!-- Inner Dashed Border -->
  <rect x="26" y="26" width="448" height="348" fill="none" stroke="#C4A482" stroke-width="1.5" stroke-dasharray="6,4" rx="6"/>

  <!-- 4 Golden Corner Rivets / Brackets -->
  <!-- Top Left -->
  <g transform="translate(20, 20)">
    <polygon points="0,0 24,0 0,24" fill="#D4AF37"/>
    <circle cx="8" cy="8" r="2.5" fill="#4A2E18"/>
  </g>
  <!-- Top Right -->
  <g transform="translate(480, 20) scale(-1, 1)">
    <polygon points="0,0 24,0 0,24" fill="#D4AF37"/>
    <circle cx="8" cy="8" r="2.5" fill="#4A2E18"/>
  </g>
  <!-- Bottom Left -->
  <g transform="translate(20, 380) scale(1, -1)">
    <polygon points="0,0 24,0 0,24" fill="#D4AF37"/>
    <circle cx="8" cy="8" r="2.5" fill="#4A2E18"/>
  </g>
  <!-- Bottom Right -->
  <g transform="translate(480, 380) scale(-1, -1)">
    <polygon points="0,0 24,0 0,24" fill="#D4AF37"/>
    <circle cx="8" cy="8" r="2.5" fill="#4A2E18"/>
  </g>
</svg>
