<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap');
      .seal-text { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; fill: #FDF6E2; text-anchor: middle; font-style: italic; }
      .seal-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 7px; font-weight: 700; fill: #FDE68A; text-anchor: middle; letter-spacing: 1.5px; }
    </style>

    <radialGradient id="waxRadial" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#601010"/>
    </radialGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#sealShadow)" transform="translate(60, 60)">
    <!-- Organic Wax Drips Border -->
    <path d="M 0,-48 C 20,-52 44,-36 48,-16 C 52,4 40,32 30,44 C 18,52 -10,54 -28,46 C -46,38 -54,16 -48,-10 C -42,-34 -20,-44 0,-48 Z" fill="url(#waxRadial)" stroke="#3A080E" stroke-width="3"/>

    <!-- Inner Indented Wax Ring -->
    <circle cx="0" cy="0" r="34" fill="url(#waxRadial)" stroke="#D4AF37" stroke-width="2" stroke-dasharray="4,2"/>
    <circle cx="0" cy="0" r="28" fill="#88131B" stroke="#F87171" stroke-width="1"/>

    <!-- Couple Monogram I & F -->
    <text x="0" y="8" class="seal-text">I&amp;F</text>
    <text x="0" y="22" class="seal-sub">31 OKT 2026</text>
  </g>
</svg>
