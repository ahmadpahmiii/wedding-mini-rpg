<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Bouquet Wrapping Paper -->
  <polygon points="10,18 22,18 18,30 14,30" fill="#FDF6E2"/>
  <polygon points="10,18 22,18 18,30 14,30" fill="none" stroke="#C4A482" stroke-width="1"/>
  <!-- Ribbon Bow -->
  <rect x="14" y="24" width="4" height="3" fill="#EC4899"/>
  <rect x="12" y="25" width="2" height="2" fill="#F472B6"/>
  <rect x="18" y="25" width="2" height="2" fill="#F472B6"/>

  <!-- Jasmine & Rose Blossoms -->
  <!-- Center White Jasmine -->
  <circle cx="16" cy="14" r="4" fill="#FFFFFF"/>
  <circle cx="16" cy="14" r="1.5" fill="#F59E0B"/>

  <!-- Red Rose Left -->
  <circle cx="11" cy="11" r="3.5" fill="#EF4444"/>
  <circle cx="11" cy="11" r="1.5" fill="#FCA5A5"/>

  <!-- Pink Rose Right -->
  <circle cx="21" cy="11" r="3.5" fill="#F472B6"/>
  <circle cx="21" cy="11" r="1.5" fill="#FDF2F8"/>

  <!-- Top Yellow Flower -->
  <circle cx="16" cy="7" r="3" fill="#FBBF24"/>
  <circle cx="16" cy="7" r="1" fill="#FFFFFF"/>

  <!-- Green Leaves -->
  <polygon points="6,14 10,12 8,16" fill="#10B981"/>
  <polygon points="26,14 22,12 24,16" fill="#10B981"/>
  <polygon points="12,5 14,8 10,8" fill="#059669"/>
  <polygon points="20,5 18,8 22,8" fill="#059669"/>
</svg>
