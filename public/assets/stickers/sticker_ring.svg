<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Left Ring -->
  <circle cx="12" cy="18" r="8" fill="#F59E0B"/>
  <circle cx="12" cy="18" r="5" fill="#FFFFFF"/>
  <circle cx="12" cy="18" r="8" fill="none" stroke="#D97706" stroke-width="1.5"/>

  <!-- Right Ring Interlocked -->
  <circle cx="20" cy="18" r="8" fill="#FBBF24"/>
  <circle cx="20" cy="18" r="5" fill="#FFFFFF"/>
  <circle cx="20" cy="18" r="8" fill="none" stroke="#D97706" stroke-width="1.5"/>

  <!-- Brilliant Cut Diamond on Left Ring -->
  <polygon points="12,5 16,9 12,13 8,9" fill="#38BDF8"/>
  <polygon points="12,6 15,9 12,12 9,9" fill="#E0F2FE"/>
  <polygon points="12,7 14,9 12,11 10,9" fill="#FFFFFF"/>

  <!-- Sparkle Rays -->
  <line x1="12" y1="2" x2="12" y2="4" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="5" y1="9" x2="7" y2="9" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="17" y1="9" x2="19" y2="9" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="7" y1="4" x2="8" y2="5" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="17" y1="4" x2="16" y2="5" stroke="#38BDF8" stroke-width="1.5"/>
</svg>
